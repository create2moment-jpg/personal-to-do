# Local deployment. Private data stays on the host in PPOS_LOCAL_DATA_DIR.
#   PPOS_LOCAL_DATA_DIR=~/PersonalProductivityData docker compose -f deploy/docker-compose.yml up -d
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ppos:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"   # loopback only; no LAN exposure by default
    volumes:
      - ${PPOS_LOCAL_DATA_DIR:-~/PersonalProductivityData}:/data
    environment:
      PPOS_AUTO_MIGRATE: "false"
      PPOS_CORS_ORIGINS: '["http://127.0.0.1:8765"]'
  # Phase 5: local inference. Uncomment to run Ollama alongside the app.
  # ollama:
  #   image: ollama/ollama:0.5.4
  #   ports: ["127.0.0.1:11434:11434"]
  #   volumes: ["${PPOS_LOCAL_DATA_DIR:-~/PersonalProductivityData}/ai/ollama:/root/.ollama"]
