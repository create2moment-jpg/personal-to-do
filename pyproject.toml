[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ppos"
version = "0.1.0"
description = "Personal Productivity & AI Operating System — local-first planning, notes and knowledge."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
ppos = "ppos.cli:main"

[tool.setuptools.packages.find]
where = ["packages", "apps/api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages", "apps/api"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["packages", "apps/api", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PTH", "N"]
ignore = ["S101", "S608"]  # asserts in tests; SQL built only from whitelisted column names

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH"]
"packages/ppos/demo.py" = ["E501"]  # long synthetic content strings

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = ["packages", "apps/api"]
packages = ["ppos", "ppos_api"]
