name: ci
on:
  push:
  pull_request:

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Private-data / secrets boundary check
        run: python3 scripts/check_repo_safety.py --all

  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install --require-hashes -r requirements-dev.lock && pip install --no-deps -e .
      - run: ruff check . && ruff format --check .
      - run: mypy
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  bundle:
    # Ready-to-run zip with the web app prebuilt: installs with Python only
    # (python scripts/install.py), no Node.js on the laptop. Download it from
    # the run's Artifacts as "personal-os-bundle".
    runs-on: ubuntu-latest
    needs: [safety, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build web UI
        working-directory: apps/web
        run: npm ci && npm run build
      - run: python3 scripts/package.py --out build
      - uses: actions/upload-artifact@v4
        with:
          name: personal-os-bundle
          path: build/*.zip
          retention-days: 30

  backend-windows:
    # The app runs on Windows laptops too: same tests, Windows file and path rules.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: pip install --no-deps -e .
      - run: pytest -p no:cacheprovider

  install-smoke:
    # What a laptop does: unzip the bundle, install with Python only, start, load the app.
    needs: [bundle]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: personal-os-bundle
      - name: Install from the bundle (no Node.js used)
        shell: bash
        run: |
          python -c "import zipfile,glob; zipfile.ZipFile(glob.glob('personal-os-*.zip')[0]).extractall('.')"
          cd personal-os-*/
          python scripts/install.py --no-env --data-dir "$RUNNER_TEMP/ppos-data"
      - name: Start the app and load a page
        shell: bash
        run: |
          cd personal-os-*/
          if [ -x .venv/Scripts/ppos.exe ]; then ppos=.venv/Scripts/ppos.exe; else ppos=.venv/bin/ppos; fi
          "$ppos" --data-dir "$RUNNER_TEMP/ppos-data" serve --port 8765 > "$RUNNER_TEMP/serve.log" 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for _ in range(60):
              try:
                  html = urllib.request.urlopen("http://127.0.0.1:8765/", timeout=2).read().decode()
                  assert "<title>Personal OS</title>" in html, html[:200]
                  print("app is up")
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit("app did not start")
          PY

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: pip install --require-hashes -r requirements.lock && pip install --no-deps -e .
      - name: Build web UI
        working-directory: apps/web
        run: npm ci && npm run build
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (synthetic demo workspace)
        working-directory: apps/web
        env:
          PPOS_BIN: ppos
        run: npx playwright test --trace off
